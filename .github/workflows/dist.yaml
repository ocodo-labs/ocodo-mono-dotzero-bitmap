name: Release bitmap fonts

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${VERSION}"
            echo "Release tags must be in the form X.Y.Z"
            exit 1
          fi

      - name: Install source font
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          FONT_DIR="${HOME}/.local/share/fonts"
          FONT_PATH="${FONT_DIR}/OcodoMonoDotZero-Light.ttf"
          FONT_URL="https://cdn.jsdelivr.net/npm/@ocodo/ocodo-mono-dotzero@${VERSION}/fonts/OcodoMonoDotZero-Light.ttf"

          mkdir -p "${FONT_DIR}"

          echo "Downloading source font ${VERSION}"
          echo "${FONT_URL}"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "${FONT_URL}" \
            --output "${FONT_PATH}"

          test -s "${FONT_PATH}"

      - name: Generate bitmap fonts
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          for height in 16 24 32 48 64 96; do
            echo "Generating ${height}px..."
            uv run python -m ocodo_bitmap.generate "${height}"
          done

      - name: Verify generated fonts
        run: |
          set -euo pipefail

          mapfile -t fonts < <(find dist -type f -name '*.psfu' -print | sort)

          if [[ "${#fonts[@]}" -ne 6 ]]; then
            echo "Expected exactly 6 PSF2 fonts, found ${#fonts[@]}:"
            printf '%s\n' "${fonts[@]}"
            exit 1
          fi

          printf '%s\n' "${fonts[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release create \
            "${VERSION}" \
            dist/*.psfu \
            --generate-notes
