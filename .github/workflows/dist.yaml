name: Release bitmap fonts

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${VERSION}"
            echo "Release tags must be in the form X.Y.Z"
            exit 1
          fi

      - name: Generate bitmap fonts
        env:
          FONT_VERSION: ${{ github.ref_name }}
        run: ./install.sh

      - name: Verify generated fonts
        run: |
          set -euo pipefail

          mapfile -t fonts < <(
            find dist -type f -name '*.psfu' -print | sort
          )

          if [[ "${#fonts[@]}" -eq 0 ]]; then
            echo "No PSF2 fonts generated."
            exit 1
          fi

          printf '%s\n' "${fonts[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release create \
            "${VERSION}" \
            dist/*.psfu \
            --generate-notes
