[project]
name = "ocodo-mono-dotzero-bitmap"
version = "1.0.2"
description = "Generate Linux PSF2 bitmap console fonts from Ocodo Mono DotZero Nerd Font"
requires-python = ">=3.11"
dependencies = [
    "freetype-py",
]

[project.scripts]
ocodo-bitmap = "ocodo_bitmap.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocodo_bitmap"]
